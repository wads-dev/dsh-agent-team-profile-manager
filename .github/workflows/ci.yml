name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify plugin and DSH versions match
        run: npm run check:versions
      - name: Build Host and Web plugin
        run: npm run build
      - name: Run automated tests and release checks
        run: npm test
      - name: Verify npm package contents
        run: npm pack --dry-run
